<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | EMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #F4F7FC;
            color: #1E293B;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        h1 {
            color: #14213D;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748B;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .save-btn {
            background: #2563EB;
            color: white;
        }

        .save-btn:hover {
            background: #1D4ED8;
        }

        .cancel-btn {
            background: #F1F5F9;
            color: #475569;
        }

        .cancel-btn:hover {
            background: #E2E8F0;
        }

        .error {
            background: #FEE2E2;
            color: #B91C1C;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media(max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 23px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Edit Profile</h1>

            <p class="subtitle">
                Update your account username and email address.
            </p>

            <div class="error"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <form th:action="@{/profile/edit}"
                  th:object="${user}"
                  method="post">

                <div class="form-group">
                    <label>Username</label>

                    <input type="text"
                           th:field="*{username}"
                           required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>

                    <input type="email"
                           th:field="*{email}"
                           required>
                </div>

                <div class="button-group">

                    <button type="submit" class="btn save-btn">
                        Save Changes
                    </button>

                    <a th:href="@{/profile}"
                       class="btn cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
