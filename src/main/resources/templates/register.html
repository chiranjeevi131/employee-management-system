<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Admin Registration | Employee Management System</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        padding: 20px;
    }

    .register-container {
        width: 400px;
        padding: 35px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
        text-align: center;
        color: #1e3c72;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
        font-size: 14px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
    }

    input:focus {
        border-color: #2a5298;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #1e3c72;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #2a5298;
    }

    .error {
        background: #ffe5e5;
        color: #c62828;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 5px;
        text-align: center;
        font-size: 14px;
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }

    .login-link a {
        color: #1e3c72;
        text-decoration: none;
        font-weight: bold;
    }
</style>


</head>

<body>


<div class="register-container">

    <h2>Admin Registration</h2>

    <p class="subtitle">Create your administrator account</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">

        <label for="username">Username</label>
        <input type="text"
               id="username"
               th:field="*{username}"
               placeholder="Enter username"
               required>

        <label for="email">Email</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               placeholder="Enter email"
               required>

        <label for="password">Password</label>
        <input type="password"
               id="password"
               th:field="*{password}"
               placeholder="Create password"
               minlength="8"
               required>

        <button type="submit">Register Admin</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a th:href="@{/login}">Login here</a>
    </div>

</div>


</body>
</html>
